<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析报告 - 见历</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .report-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--space-xl);
      margin-top: var(--space-xl);
      margin-bottom: 120px;
    }
    .report-sidebar {
      position: sticky;
      top: 20px;
      height: fit-content;
    }
    .jd-tab {
      padding: var(--space-md);
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-bottom: var(--space-sm);
      border: 1px solid transparent;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .jd-tab:hover { background: var(--surface); }
    .jd-tab.active {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }
    .match-pill {
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .score-hero {
      display: flex;
      align-items: center;
      gap: var(--space-xl);
      margin-bottom: var(--space-xl);
    }
    .score-circle {
      width: 120px;
      height: 120px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 8px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
    }
    .score-val { font-size: 2.5rem; font-weight: 800; line-height: 1; color: var(--accent); }
    .score-label { font-size: 0.8rem; color: var(--muted); }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }
    .stat-card h4 { font-size: 0.9rem; color: var(--muted); margin-bottom: 4px; }
    .stat-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: var(--space-sm);
    }
    .stat-progress { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.8s ease; }

    .issue-item {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-md) 0;
      border-bottom: 1px solid var(--border);
    }
    .issue-item:last-child { border-bottom: none; }
    .issue-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--warning, #ed8936);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .issue-icon.success { background: var(--success, #38a169); }

    .code-block {
      background: var(--bg);
      padding: var(--space-md);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-top: var(--space-sm);
      border-left: 3px solid var(--accent);
    }

    .download-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      gap: var(--space-md);
      z-index: 1000;
    }

    .loading-placeholder {
      text-align: center;
      padding: var(--space-xxl);
      color: var(--muted);
    }

    @media (max-width: 1024px) {
      .report-layout { grid-template-columns: 1fr; }
      .report-sidebar { position: static; }
      .jd-tabs-scroll {
        display: flex;
        overflow-x: auto;
        gap: var(--space-md);
        padding-bottom: var(--space-md);
      }
      .jd-tab { flex-shrink: 0; min-width: 200px; margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <nav class="container" style="height: 72px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);">
    <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px;">
      见历
    </div>
    <button class="btn btn-outline" onclick="location.href='landing.html'">重新分析</button>
  </nav>

  <main class="container">
    <div id="report-root">
      <div class="loading-placeholder">正在加载分析结果...</div>
    </div>
  </main>

  <div class="download-float" id="download-float" style="display: none;">
    <button class="btn btn-outline" id="dl-report-btn" style="background: white; box-shadow: var(--shadow-md);" onclick="downloadReport()">下载详细分析报告</button>
    <button class="btn btn-primary" id="dl-docx-btn" style="box-shadow: var(--shadow-md);" onclick="downloadDocx()">下载 AI 优化版简历 (.txt)</button>
  </div>

  <script>
    let reportData = null;
    let recordId = null;

    // 从 sessionStorage 读取分析结果
    const resultJson = sessionStorage.getItem('analysisResult');
    recordId = sessionStorage.getItem('currentRecordId');

    if (!resultJson || !recordId) {
      document.getElementById('report-root').innerHTML = `
        <div class="loading-placeholder">
          <p>⚠️ 未找到分析结果。</p>
          <button class="btn btn-primary" style="margin-top: 16px;" onclick="location.href='landing.html'">返回首页重新分析</button>
        </div>
      `;
    } else {
      try {
        reportData = JSON.parse(resultJson);
        renderReport(reportData);
      } catch (e) {
        document.getElementById('report-root').innerHTML = `<div class="loading-placeholder">❌ 结果解析失败，请返回重试。</div>`;
      }
    }

    function renderReport(data) {
      const jobs = data.jobs || [];
      const stats = data.stats || {};
      const issues = data.issues || [];

      document.getElementById('download-float').style.display = 'flex';

      const firstJob = jobs.length > 0 ? jobs[0] : null;

      const html = `
        <div class="report-layout">
          <aside class="report-sidebar">
            <h3>目标岗位</h3>
            <p class="text-muted" style="font-size: 0.85rem; margin-bottom: var(--space-lg);">切换查看不同岗位的匹配分析</p>
            <div class="jd-tabs-scroll" id="jd-tabs">
              ${jobs.map((job, idx) => `
                <div class="jd-tab ${idx === 0 ? 'active' : ''}"
                     onclick="switchJob('${escapeAttr(job.key)}', this)">
                  <span>${escapeHtml(job.title)}</span>
                  <span class="match-pill">${job.match_rate}% 匹配</span>
                </div>
              `).join('')}
              ${jobs.length === 0 ? '<p class="text-muted" style="font-size:0.85rem;">未指定目标岗位</p>' : ''}
            </div>
          </aside>

          <section class="report-content" id="report-content">
            <!-- 总分卡片 -->
            <div class="card" style="margin-bottom: var(--space-xl);">
              <div class="score-hero">
                <div class="score-circle">
                  <span class="score-val">${data.overall_score || 0}</span>
                  <span class="score-label">总评分</span>
                </div>
                <div>
                  <h1 id="job-title-display">${firstJob ? escapeHtml(firstJob.title) + ' - 岗位匹配报告' : '简历整体分析报告'}</h1>
                  <p class="text-muted mt-sm">${escapeHtml(data.verdict_30s || '')}</p>
                </div>
              </div>

              <!-- 四维指标 -->
              <div class="stat-grid">
                ${renderStatCard('内容完整度', stats.content_integrity)}
                ${renderStatCard('表达清晰度', stats.expression_clarity)}
                ${renderStatCard('经历质量', stats.experience_quality)}
                ${renderStatCard('关键词覆盖', stats.keyword_coverage)}
              </div>
            </div>

            <!-- 岗位匹配优势与差距 -->
            <div id="job-detail-section">
              ${firstJob ? renderJobDetail(firstJob) : ''}
            </div>

            <!-- 问题诊断与建议 -->
            <div class="card mt-lg">
              <h3 style="margin-bottom: var(--space-lg);">主要问题诊断与优化建议</h3>
              ${issues.length > 0 ? issues.map(issue => `
                <div class="issue-item">
                  <div class="issue-icon">!</div>
                  <div style="flex: 1;">
                    <p style="font-weight: 600;">${escapeHtml(issue.title || '')}</p>
                    <p class="text-muted" style="margin: 4px 0 var(--space-sm);">${escapeHtml(issue.impact || '')}</p>
                    <div class="code-block">
                      <p><strong>优化前：</strong>${escapeHtml(issue.before || '')}</p>
                      <p class="mt-sm"><strong>优化后：</strong>${escapeHtml(issue.after || '')}</p>
                    </div>
                  </div>
                </div>
              `).join('') : '<p class="text-muted">暂无明显硬伤，表现良好！</p>'}
            </div>
          </section>
        </div>
      `;
      document.getElementById('report-root').innerHTML = html;
    }

    function renderStatCard(label, value) {
      const pct = value || 0;
      return `
        <div class="stat-card">
          <h4>${label}</h4>
          <div style="display: flex; justify-content: space-between; font-weight: 600;">
            <span>${pct}%</span>
          </div>
          <div class="stat-bar"><div class="stat-progress" style="width: ${pct}%;"></div></div>
        </div>
      `;
    }

    function renderJobDetail(job) {
      if (!job) return '';
      const advantages = job.advantages || [];
      const gaps = job.gaps || [];
      return `
        <div class="grid grid-2">
          <div class="card">
            <h3 style="margin-bottom: var(--space-lg);">匹配优势</h3>
            ${advantages.length > 0 ? advantages.map(a => `
              <div class="issue-item">
                <div class="issue-icon success">✓</div>
                <div>
                  <p style="font-weight: 600;">${escapeHtml(a.title || '')}</p>
                  <p class="text-muted" style="font-size: 0.85rem;">${escapeHtml(a.desc || '')}</p>
                </div>
              </div>
            `).join('') : '<p class="text-muted">暂无数据</p>'}
          </div>
          <div class="card">
            <h3 style="margin-bottom: var(--space-lg);">缺失能力/关键词</h3>
            ${gaps.length > 0 ? gaps.map(g => `
              <div class="issue-item">
                <div class="issue-icon">!</div>
                <div>
                  <p style="font-weight: 600;">${escapeHtml(g.title || '')}</p>
                  <p class="text-muted" style="font-size: 0.85rem;">${escapeHtml(g.desc || '')}</p>
                </div>
              </div>
            `).join('') : '<p class="text-muted">暂无数据</p>'}
          </div>
        </div>
      `;
    }

    window.switchJob = function(key, tabEl) {
      document.querySelectorAll('.jd-tab').forEach(t => t.classList.remove('active'));
      tabEl.classList.add('active');

      const job = (reportData.jobs || []).find(j => j.key === key);
      const titleEl = document.getElementById('job-title-display');
      if (titleEl && job) titleEl.textContent = job.title + ' - 岗位匹配报告';

      const detailSection = document.getElementById('job-detail-section');
      if (detailSection) detailSection.innerHTML = renderJobDetail(job);
    };

    window.downloadReport = function() {
      if (recordId) window.open(`/api/analyze/download/report/${recordId}`, '_blank');
    };

    window.downloadDocx = function() {
      if (recordId) window.open(`/api/analyze/download/docx/${recordId}`, '_blank');
    };

    function escapeHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
