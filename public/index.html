<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>见历 - AI 简历分析与优化</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hero {
      padding: var(--space-xxl) 0;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: var(--space-md);
      color: var(--fg);
    }
    .hero p {
      font-size: 1.25rem;
      color: var(--muted);
      max-width: 700px;
      margin: 0 auto;
    }

    .upload-container {
      max-width: 800px;
      margin: 0 auto var(--space-xxl);
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      background: var(--surface);
      transition: border-color 0.3s;
      cursor: pointer;
    }
    .upload-zone:hover {
      border-color: var(--accent);
    }
    .upload-icon {
      font-size: 3rem;
      margin-bottom: var(--space-md);
      color: var(--accent);
      display: block;
    }

    .jd-section {
      margin-top: var(--space-xl);
    }
    .jd-card {
      margin-bottom: var(--space-md);
      position: relative;
    }
    .jd-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
    }
    .jd-input {
      width: 100%;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: var(--radius-sm);
      margin-top: var(--space-sm);
      font-family: var(--font-body);
    }
    .jd-textarea {
      height: 100px;
      resize: vertical;
    }

    .action-bar {
      position: sticky;
      bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: var(--space-md) 0;
      margin-top: var(--space-xl);
      z-index: 100;
    }
    .action-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 6px;
    }

    .credits-tag {
      background: var(--bg);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Mobile specific */
    @media (max-width: 768px) {
      .action-content {
        flex-direction: column;
        gap: var(--space-md);
      }
      .btn-analyze {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="container nav">
    <div class="logo">
      <div class="logo-icon"></div>
      见历
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
      <span class="text-muted" style="font-size: 0.9rem;">免费额度：剩余 3 次</span>
      <button class="btn btn-outline">登录</button>
    </div>
  </nav>

  <main class="container">
    <header class="hero">
      <h1>看见简历问题，<br>也看见更适合你的岗位机会。</h1>
      <p>上传简历，获得 AI 分析报告、岗位匹配度和可编辑优化版本</p>
    </header>

    <div class="upload-container">
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" style="display: none;">
        <span class="upload-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </span>
        <h3>点击或拖拽上传简历</h3>
        <p class="text-muted mt-sm">支持 PDF, Word, Markdown, TXT 格式</p>
      </div>

      <div class="jd-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md);">
          <h2>目标岗位 (可选)</h2>
          <button class="btn btn-outline" style="font-size: 0.85rem;" onclick="addJD()">+ 添加岗位</button>
        </div>
        <p class="text-muted" style="margin-bottom: var(--space-lg);">添加目标岗位，AI 将为您提供精准的匹配度分析与优化建议。</p>
        
        <div id="jdList">
          <div class="card jd-card">
            <input type="text" class="jd-input" placeholder="输入岗位名称 (例如: 产品经理)">
            <textarea class="jd-input jd-textarea" placeholder="粘贴岗位描述 / JD (可选，填写后分析更精准)"></textarea>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="action-bar">
    <div class="container action-content">
      <div>
        <p style="font-size: 0.9rem; font-weight: 500;">本次分析预计消耗</p>
        <p class="text-muted" style="font-size: 0.8rem;" id="costDisplay">普通分析 10 点 + 1 个岗位 10 点 = 共 20 点</p>
      </div>
      <button class="btn btn-primary btn-analyze" style="padding: 14px 40px; font-size: 1.1rem;" onclick="startAnalysis()">
        分析我的简历
      </button>
    </div>
  </div>

  <script>
    let selectedFile = null;

    // 绑定 fileInput 监听
    document.getElementById('fileInput').addEventListener('change', handleFileSelect);

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        const zone = document.querySelector('.upload-zone');
        zone.style.borderColor = 'var(--success)';
        zone.innerHTML = `
          <input type="file" id="fileInput" style="display: none;">
          <span class="upload-icon" style="color: var(--success); display: block; font-size: 3rem; margin-bottom: var(--space-md);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          </span>
          <h3 style="color: var(--success)">已选择简历文件</h3>
          <p style="font-weight: 600;" class="mt-sm">${file.name} (${(file.size / 1024).toFixed(1)} KB)</p>
          <p class="text-muted mt-sm" style="font-size: 0.85rem">点击此处可重新选择文件</p>
        `;
        // 重新绑定 fileInput 监听
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
      }
    }

    function addJD() {
      const list = document.getElementById('jdList');
      const div = document.createElement('div');
      div.className = 'card jd-card';
      div.innerHTML = `
        <span class="jd-remove" onclick="this.parentElement.remove(); updateCost();">删除</span>
        <input type="text" class="jd-input" placeholder="输入岗位名称">
        <textarea class="jd-input jd-textarea" placeholder="粘贴岗位描述 / JD"></textarea>
      `;
      list.appendChild(div);
      updateCost();
    }

    function updateCost() {
      const count = document.querySelectorAll('.jd-card').length;
      const total = 10 + count * 10;
      document.getElementById('costDisplay').textContent = `普通分析 10 点 + ${count} 个岗位 ${count * 10} 点 = 共 ${total} 点`;
    }

    async function startAnalysis() {
      if (!selectedFile) {
        alert('请先点击上方区域上传您的简历文件！');
        return;
      }

      // 获取岗位列表
      const jdCards = document.querySelectorAll('.jd-card');
      const jobs = [];
      jdCards.forEach(card => {
        const nameInput = card.querySelector('input');
        const descInput = card.querySelector('textarea');
        if (nameInput && nameInput.value.trim()) {
          jobs.push({
            name: nameInput.value.trim(),
            description: descInput ? descInput.value.trim() : ''
          });
        }
      });

      const btn = document.querySelector('.btn-analyze');
      btn.disabled = true;
      btn.innerText = '正在启动分析...';

      const formData = new FormData();
      formData.append('resume', selectedFile);
      formData.append('jobs', JSON.stringify(jobs));

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (data.success && data.taskId) {
          localStorage.setItem('taskId', data.taskId);
          location.href = 'analysis.html';
        } else {
          alert('启动分析失败: ' + (data.error || '未知错误'));
          btn.disabled = false;
          btn.innerText = '分析我的简历';
        }
      } catch (err) {
        console.error(err);
        alert('网络请求失败，请确保后台服务器已启动！');
        btn.disabled = false;
        btn.innerText = '分析我的简历';
      }
    }
  </script>
</body>
</html>
