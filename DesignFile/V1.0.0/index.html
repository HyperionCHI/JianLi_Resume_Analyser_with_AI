<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>见历 - 原型预览</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: #08090d;
      color: #fff;
      padding: var(--space-xxl) 0;
      min-height: 100vh;
      overflow-y: auto;
    }
    .launcher-header {
      text-align: center;
      margin-bottom: var(--space-xxl);
    }
    .launcher-header h1 {
      color: #fff;
      font-size: 2.5rem;
    }
    .launcher-header p {
      color: rgba(255, 255, 255, 0.6);
      max-width: 600px;
      margin: var(--space-md) auto 0;
    }

    .device-showcase {
      display: flex;
      flex-direction: column;
      gap: 100px;
      align-items: center;
    }

    .device-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-xl);
      width: 100%;
    }

    .device-info {
      text-align: center;
      max-width: 800px;
    }
    .device-info h2 {
      font-size: 1.5rem;
      margin-bottom: var(--space-sm);
    }
    .device-info p {
      color: rgba(255, 255, 255, 0.6);
    }

    .frame-container {
      position: relative;
      background: #1a1a1a;
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    }

    /* Scaling frames for preview */
    .macbook-frame {
      width: 1000px;
      height: 650px;
    }
    .iphone-frame {
      width: 390px;
      height: 844px;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 4px;
    }

    .nav-links {
      display: flex;
      gap: var(--space-md);
      margin-top: var(--space-xl);
      justify-content: center;
    }
    .nav-links a {
      background: rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 99px;
      color: #fff;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .nav-links a:hover {
      background: var(--accent);
    }

    @media (max-width: 1100px) {
      .macbook-frame {
        width: 100%;
        height: 0;
        padding-bottom: 65%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="launcher-header">
      <div style="width: 48px; height: 48px; background: var(--accent); border-radius: 12px; margin: 0 auto var(--space-md); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem;">见</div>
      <h1>见历 - AI 简历分析原型</h1>
      <p>「见历」是一款面向求职者的 AI 简历分析与优化工具。支持简历质量分析、岗位匹配度计算及可编辑优化版本下载。</p>
      
      <div class="nav-links">
        <a href="screens/landing.html" target="_blank">1. 首页 (上传)</a>
        <a href="screens/analysis.html" target="_blank">2. 分析中</a>
        <a href="screens/report.html" target="_blank">3. 分析结果</a>
      </div>
    </header>

    <div class="device-showcase">
      <!-- Desktop View -->
      <div class="device-row">
        <div class="device-info">
          <h2>电脑端 (Web)</h2>
          <p>以完整分析和报告查看为主，提供多岗位对比切换、详细问题诊断和下载功能。</p>
        </div>
        <div class="frame-container macbook-frame">
          <iframe src="/frames/macbook.html?screen=screens/landing.html"></iframe>
        </div>
      </div>

      <!-- Mobile View -->
      <div class="device-row">
        <div class="device-info">
          <h2>手机端 (Mobile)</h2>
          <p>以轻量上传、快速查看结果为主，适配移动端交互，优化小屏幕阅读体验。</p>
        </div>
        <div class="frame-container iphone-frame">
          <iframe src="/frames/iphone-15-pro.html?screen=screens/landing.html"></iframe>
        </div>
      </div>
    </div>

    <footer style="text-align: center; margin-top: 100px; color: rgba(255,255,255,0.4); font-size: 0.85rem;">
      <p>Open Design Prototype · 见历 AI</p>
    </footer>
  </div>
</body>
</html>
